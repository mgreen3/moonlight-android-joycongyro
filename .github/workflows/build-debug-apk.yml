name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK platform and NDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -oE "platforms;android-3[6-9][^ ]*" | sort -u
          PLATFORM=$("$SDKMANAGER" --list 2>/dev/null | grep -oE "platforms;android-37[^ ]*" | sort -V | tail -1)
          "$SDKMANAGER" "ndk;29.0.14206865" ${PLATFORM:+"$PLATFORM"}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNonRootDebug

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-x-gyro-fix-debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk
